services:
  postgres:
    image: paradedb/paradedb:0.24.1-pg18
    container_name: equitylens-seed-postgres
    labels:
      equitylens.seed: "true"
    environment:
      POSTGRES_USER: equitylens_seed
      POSTGRES_DB: equitylens_cloud_seed
      POSTGRES_PASSWORD: ${SEED_POSTGRES_PASSWORD:?required}
    ports:
      - "127.0.0.1:${SEED_POSTGRES_PORT:-55439}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U equitylens_seed -d equitylens_cloud_seed"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    container_name: equitylens-seed-redis
    labels:
      equitylens.seed: "true"
    ports:
      - "127.0.0.1:${SEED_REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
