<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>EquityLens — 暫停服務</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, "Noto Sans TC", system-ui, sans-serif;
        background: #07111f;
        color: #f5eddc;
      }
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background:
          radial-gradient(circle at 20% 20%, #17324d 0, transparent 36rem),
          linear-gradient(145deg, #07111f, #0b1828);
      }
      main {
        width: min(38rem, calc(100% - 3rem));
        padding: 3rem;
        border: 1px solid #b89a633d;
        border-radius: 1.25rem;
        background: #0c1b2be6;
        box-shadow: 0 2rem 5rem #0008;
      }
      p {
        margin: 0;
        color: #aebdca;
        line-height: 1.8;
      }
      .eyebrow {
        margin-bottom: 1rem;
        color: #d7b879;
        font-size: .75rem;
        letter-spacing: .2em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0 0 1rem;
        font-size: clamp(2rem, 6vw, 3.5rem);
        font-weight: 500;
        letter-spacing: -.04em;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">EquityLens</p>
      <h1>目前暫停服務</h1>
      <p>前端與 API 已關閉，需要測試時再重新啟動。</p>
    </main>
  </body>
</html>
