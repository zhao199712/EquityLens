services:
  postgres:
    image: timescale/timescaledb-ha:pg16
    container_name: equitylens-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-equitylens}
      POSTGRES_USER: ${POSTGRES_USER:-equitylens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-equitylens_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-equitylens} -d ${POSTGRES_DB:-equitylens}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - equitylens

  redis:
    image: redis:7-alpine
    container_name: equitylens-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - equitylens

  minio:
    image: minio/minio:latest
    container_name: equitylens-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-equitylens}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-equitylens_dev_password}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - equitylens

  minio-init:
    image: minio/mc:latest
    container_name: equitylens-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-equitylens}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-equitylens_dev_password}
      MINIO_BUCKET: ${MINIO_BUCKET:-equitylens}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      mc mb --ignore-existing local/$$MINIO_BUCKET;
      "
    networks:
      - equitylens

volumes:
  postgres-data:
  redis-data:
  minio-data:

networks:
  equitylens:
    driver: bridge
