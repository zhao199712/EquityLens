services:
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    container_name: equitylens-aspire-dashboard
    ports:
      - "${ASPIRE_DASHBOARD_PORT:-18888}:18888"
      - "${OTEL_GRPC_PORT:-4317}:18889"
    networks:
      - equitylens

  postgres:
    image: paradedb/paradedb:0.24.1-pg18
    container_name: equitylens-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-equitylens}
      POSTGRES_USER: ${POSTGRES_USER:-equitylens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-equitylens_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-equitylens} -d ${POSTGRES_DB:-equitylens}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - equitylens

  timescale:
    image: timescale/timescaledb-ha:pg16
    container_name: equitylens-timescale
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-equitylens}
      POSTGRES_USER: ${POSTGRES_USER:-equitylens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-equitylens_dev_password}
    ports:
      - "5433:5432"
    volumes:
      - timescale-data:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-equitylens} -d ${POSTGRES_DB:-equitylens}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - equitylens

  redis:
    image: redis:7-alpine
    container_name: equitylens-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - equitylens

  garage:
    image: dxflrs/garage:v2.3.0
    container_name: equitylens-garage
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_CONFIG_FILE: /etc/garage.toml
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-GK0123456789ABCDEF0123456789ABCDEF}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      GARAGE_DEFAULT_BUCKET: ${S3_BUCKET:-equitylens}
    ports:
      - "${S3_API_PORT:-9000}:3900"
      - "${GARAGE_WEB_PORT:-3902}:3902"
      - "${GARAGE_ADMIN_PORT:-3903}:3903"
    volumes:
      - garage-data:/var/lib/garage
      - ./infra/garage/garage.toml:/etc/garage.toml:ro,z
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - equitylens

  garage-webui:
    image: khairul169/garage-webui:latest
    container_name: equitylens-garage-webui
    environment:
      CONFIG_PATH: /etc/garage.toml
      API_BASE_URL: http://garage:3903
      S3_ENDPOINT_URL: http://garage:3900
    ports:
      - "${GARAGE_WEBUI_PORT:-3909}:3909"
    volumes:
      - ./infra/garage/garage.toml:/etc/garage.toml:ro,z
    depends_on:
      garage:
        condition: service_healthy
    networks:
      - equitylens

volumes:
  postgres-data:
  timescale-data:
  redis-data:
  garage-data:

networks:
  equitylens:
    driver: bridge
