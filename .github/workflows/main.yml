name: EquityLens CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  # pip 連線層重試；整個安裝的重試由 scripts/ci/pip-install.sh 負責。
  PIP_RETRIES: "10"
  PIP_TIMEOUT: "60"

concurrency:
  group: equitylens-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  risk-integration:
    name: Risk cross-language and service integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: paradedb/paradedb:0.24.1-pg18
        env:
          POSTGRES_DB: equitylens_ci
          POSTGRES_USER: equitylens_ci
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U equitylens_ci -d equitylens_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      RISK_TEST_POSTGRES: Host=localhost;Port=5432;Database=equitylens_ci;Username=equitylens_ci;Password=ci_only_password
      RISK_TEST_REDIS: localhost:6379
      RISK_TEST_REDIS_URL: redis://localhost:6379/0
      RISK_TEST_ARTIFACTS: ${{ github.workspace }}/test-results/risk-integration/evidence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: src/EquityLens.Mathematics/pyproject.toml
      - name: Install production Python engine and worker
        run: scripts/ci/pip-install.sh -e src/EquityLens.Mathematics
      - name: Run contracts and real risk pipeline
        run: >-
          dotnet test tests/EquityLens.Risk.IntegrationTests/EquityLens.Risk.IntegrationTests.csproj
          --configuration Release
          --logger "trx;LogFileName=risk-integration.trx"
          --results-directory test-results/risk-integration
      - name: Require both suites with zero skipped tests
        if: always()
        run: >-
          python3 scripts/ci/check_backend_trx.py test-results/risk-integration/risk-integration.trx
          --required-class RiskContractTests --required-class RiskPipelineTests
      - name: Upload cross-language payloads, worker logs and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: risk-integration-results
          path: test-results/risk-integration/
          if-no-files-found: warn
          retention-days: 14

  mathematics:
    name: Mathematics tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: src/EquityLens.Mathematics/pyproject.toml
      - name: Install Mathematics
        run: scripts/ci/pip-install.sh -e 'src/EquityLens.Mathematics[test,research]'
      - name: Run Mathematics tests
        run: pytest src/EquityLens.Mathematics/tests -q

  evals:
    name: Eval harness tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: evals/pyproject.toml
      - name: Install eval harness
        run: scripts/ci/pip-install.sh -e 'evals[test]'
      - name: Validate cases
        working-directory: evals
        run: python -m equitylens_eval validate --cases cases/research_v1.jsonl
      - name: Run eval harness tests
        working-directory: evals
        run: pytest -q

  backend:
    name: Backend build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: paradedb/paradedb:0.24.1-pg18
        env:
          POSTGRES_DB: equitylens_ci
          POSTGRES_USER: equitylens_ci
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U equitylens_ci -d equitylens_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      EQUITYLENS_TEST_POSTGRES_CONNECTION_STRING: Host=localhost;Port=5432;Database=equitylens_ci;Username=equitylens_ci;Password=ci_only_password

    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            src/EquityLens.Api/EquityLens.Api.csproj
            tests/EquityLens.Api.Tests/EquityLens.Api.Tests.csproj

      - name: Test deployment and seed guards (no production access)
        run: |
          bash -n scripts/deploy/deploy.sh
          python3 -m unittest discover -s scripts/deploy -v
          python3 -m unittest discover -s scripts/seed -v

      - name: Restore backend
        run: >
          dotnet restore
          src/EquityLens.Api/EquityLens.Api.csproj

      - name: Restore backend tests
        run: >
          dotnet restore
          tests/EquityLens.Api.Tests/EquityLens.Api.Tests.csproj

      - name: Build backend
        run: >
          dotnet build
          src/EquityLens.Api/EquityLens.Api.csproj
          --configuration Release
          --no-restore

      - name: Build backend tests
        run: >
          dotnet build
          tests/EquityLens.Api.Tests/EquityLens.Api.Tests.csproj
          --configuration Release
          --no-restore

      - name: Run backend tests
        run: >
          dotnet test
          tests/EquityLens.Api.Tests/EquityLens.Api.Tests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=backend-tests.trx"
          --results-directory "${{ github.workspace }}/test-results/backend"
          --collect "XPlat Code Coverage"

      - name: Upload backend test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: test-results/backend
          if-no-files-found: warn
          retention-days: 14

      - name: Require executed PostgreSQL integration tests
        if: always()
        run: |
          python3 -m unittest discover -s scripts/ci -v
          python3 scripts/ci/check_backend_trx.py test-results/backend/backend-tests.trx

  browser:
    name: Browser smoke (mock API, production build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/EquityLens.Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/EquityLens.Web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Browser smoke tests without external APIs
        run: npm run test:e2e:ci
      - name: Upload browser traces and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-results
          path: |
            src/EquityLens.Web/playwright-report/
            src/EquityLens.Web/test-results/
          if-no-files-found: warn
          retention-days: 14

  frontend:
    name: Frontend build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: src/EquityLens.Web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/EquityLens.Web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: equitylens-web-dist
          path: src/EquityLens.Web/dist
          if-no-files-found: error
          retention-days: 14
