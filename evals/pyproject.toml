[project]
name = "equitylens-eval"
version = "0.1.0"
description = "Eval harness for EquityLens research answers (RAG and agent workflows)"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["equitylens_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
